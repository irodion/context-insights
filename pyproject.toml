# Tool configuration only — this is a personal tool, not a distributed package,
# so there is deliberately no [project] table and no build backend.
# Pinned tool versions live in requirements-dev.txt.

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.13"
files = ["."]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

# The Agent Source seam only holds if adapters are annotated: an unannotated loader
# is `Callable[[Path], Any]`, which satisfies `SessionLoader` without conforming to
# `Session`. Required in parse_codex.py, where the adapters live; the test file keeps
# its unannotated `def test_...(self)` methods.
[[tool.mypy.overrides]]
module = "parse_codex"
disallow_untyped_defs = true
